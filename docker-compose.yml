services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: storedb
      POSTGRES_USER: store
      POSTGRES_PASSWORD: storepass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  storage-service:
    build: ./storage-service
    ports:
      - "9001:9001"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/storedb
      SPRING_DATASOURCE_USERNAME: store
      SPRING_DATASOURCE_PASSWORD: storepass
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
    depends_on:
      - db

  user-service:
    build: ./user-service
    ports:
      - "8081:8080"
    environment:
      STORAGE_SERVICE_URL: http://storage-service:9001
      SPRING_REDIS_URL: redis://redis:6379
      PAYMENT_SERVICE_URL: http://payment-service:9102
      LOGGING_LEVEL_org_springframework_data_redis: DEBUG
      LOGGING_LEVEL_io_lettuce_core: DEBUG
    depends_on:
      - storage-service
      - redis

  payment-service:
    build: ./payment-service
    ports:
      - "9102:9102"
    environment:
      # no secrets by default; set PAYMENT_API_KEY if you add API protection later
      JVM_OPTS: "-Xms128m -Xmx512m"
    depends_on:
      - storage-service

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"            # S3-compatible API
      - "127.0.0.1:9005:9001"  # Admin console bound to localhost only (host 9005 -> container 9001)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  bff-node:
    build: ./bff-node
    ports:
      - "3000:3000"
    environment:
      URL_CART_SERVICE: "http://user-service:8080"
      URL_USER_SERVICE: "http://user-service:8080"
      URL_PAYMENT_SERVICE: "http://payment-service:9102"
      MINIO_URL: "http://minio:9000"
      STORAGE_SERVICE_URL: "http://storage-service:9001"
    depends_on:
      - storage-service
      - payment-service
      - minio
volumes:
  pgdata:
  minio-data:
