services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: storedb
      POSTGRES_USER: store
      POSTGRES_PASSWORD: storepass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  storage-service:
    build: ./storage-service
    ports:
      - "9001:9001"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/storedb
      SPRING_DATASOURCE_USERNAME: store
      SPRING_DATASOURCE_PASSWORD: storepass
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
    depends_on:
      - db

  user-service:
    build: ./user-service
    ports:
      - "8080:8080"
    environment:
      STORAGE_SERVICE_URL: http://storage-service:9001
      SPRING_REDIS_URL: redis://redis:6379
      LOGGING_LEVEL_org_springframework_data_redis: DEBUG
      LOGGING_LEVEL_io_lettuce_core: DEBUG
    depends_on:
      - storage-service
      - redis

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
