version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: storedb
      POSTGRES_USER: store
      POSTGRES_PASSWORD: storepass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  storage-service:
    build: ./storage-service
    ports:
      - "9001:9001"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/storedb
      SPRING_DATASOURCE_USERNAME: store
      SPRING_DATASOURCE_PASSWORD: storepass
    depends_on:
      - db

  user-service:
    build: ./user-service
    ports:
      - "9002:9002"
    environment:
      STORAGE_SERVICE_URL: http://storage-service:9001
    depends_on:
      - storage-service

volumes:
  pgdata:
